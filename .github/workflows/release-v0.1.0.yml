name: Publish v0.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stop if the release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build source archive
        if: steps.release_check.outputs.exists == 'false'
        run: |
          zip -qr semantic-density-protocol-v0.1.0.zip .             -x '.git/*' 'dist/*' '*/__pycache__/*' '*.pyc' '*.egg-info/*'

      - name: Create GitHub release
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0             semantic-density-protocol-v0.1.0.zip             --target "$GITHUB_SHA"             --title "Semantic Density Protocol v0.1.0"             --notes "Experimental pilot specification. Includes the N-E-D observational formula, Ashby lens constraint, annotation protocol, schemas, historical provenance data, pilot examples, reference calculator, validator, and tests. This release is not a calibrated benchmark."
