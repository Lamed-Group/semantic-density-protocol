[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-density-protocol"
version = "0.1.0"
description = "Experimental semantic-density annotation protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Alexander Gorin / Lamed Group"}
]
dependencies = []

[project.urls]
Homepage = "https://www.lamedgroup.info/semantic-density-methodology/"
Repository = "https://github.com/BigLamed/semantic-density-protocol"

[project.scripts]
semantic-density = "semantic_density.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

